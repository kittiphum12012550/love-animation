<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Love Heart - Sweep Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // ตั้งค่าขนาด Canvas ตามหน้าจอ
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const phrases = [
        "I love you", "Seni seviyorum", "Te amo", "Ti amo", "Je t'aime",
        "Я тебя люблю", "Ich liebe dich", "Aku cinta kamu", "Kocham cię",
        "Jag älskar dig", "ฉันรักคุณ", "사랑해", "我爱你", "Anh yêu em"
    ];

    const colors = ["#ff0055", "#ff3300", "#ff66aa", "#ff0000", "#ffffff"];

    const points = [];
    const numPoints = 250;

    // คำนวณพิกัดและข้อมูลของทุกจุดเก็บไว้ก่อน (เหมือนใน Python)
    for (let i = 0; i < numPoints; i++) {
        const t = (i / numPoints) * (2 * Math.PI);
        const scale = 10 + Math.random() * 8; // สุ่มสเกล 10 ถึง 18

        // สูตรสมการรูปหัวใจ
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        const text = phrases[Math.floor(Math.random() * phrases.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const fontSize = Math.floor(Math.random() * (18 - 10 + 1)) + 10; // สุ่มฟอนต์ 10 ถึง 18

        points.push({
            x: x * scale,
            y: y * scale, // จะไปกลับด้านแกน Y ตอนวาด
            text: text,
            color: color,
            fontSize: fontSize
        });
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let currentIndex = 0;

    // ฟังก์ชันสำหรับวาดอนิเมชันทีละจุด
    function drawNextPoint() {
        if (currentIndex < points.length) {
            const p = points[currentIndex];
            
            // แปลงพิกัด (แกน Y ของ Canvas ต้องติดลบเพื่อกลับด้านให้ตรงกับคณิตศาสตร์)
            const drawX = centerX + p.x;
            const drawY = centerY - p.y;

            ctx.font = `bold ${p.fontSize}px Arial`;
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, drawX, drawY);

            currentIndex++;
            
            // เรียกฟังก์ชันตัวเองในเฟรมถัดไปเพื่อสร้างอนิเมชัน
            requestAnimationFrame(drawNextPoint);
        }
    }

    // เริ่มเล่นอนิเมชัน
    drawNextPoint();

    // วาดใหม่เมื่อเปลี่ยนขนาดหน้าจอ
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        currentIndex = 0;
        drawNextPoint();
    });
</script>

</body>
</html>
