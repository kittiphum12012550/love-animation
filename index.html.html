<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning in Many Languages</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // ตั้งค่าขนาด Canvas
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // เปลี่ยนคำเป็น "Good Morning" ในภาษาต่างๆ
    const phrases = [
        { text: "Good morning", color: "white" },
        { text: "Bonjour", color: "red" },
        { text: "Guten Morgen", color: "pink" },
        { text: "Buenos días", color: "orange" },
        { text: "Buongiorno", color: "white" },
        { text: "อรุณสวัสดิ์", color: "red" },
        { text: "Доброе утро", color: "pink" },
        { text: "God morgon", color: "orange" },
        { text: "Günaydın", color: "white" },
        { text: "Selamat pagi", color: "red" },
        { text: "おはよう", color: "pink" }
    ];

    const numPoints = 150;
    const scale = Math.min(canvas.width, canvas.height) / 45; // ปรับขนาดตามหน้าจอ
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let i = 0; i < numPoints; i++) {
        const t = i * (Math.PI * 2 / numPoints);
        
        // สูตรสมการรูปหัวใจ
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        // แปลงพิกัด
        const drawX = centerX + (x * scale);
        const drawY = centerY - (y * scale);

        const phraseObj = phrases[i % phrases.length];
        const fontSize = (i % 3 === 0) ? 14 : 18;

        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillStyle = phraseObj.color;
        ctx.fillText(phraseObj.text, drawX, drawY);
    }
</script>

</body>
</html>
